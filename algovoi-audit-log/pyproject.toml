[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-audit-log"
version = "0.1.4"
description = "Verifiable Audit Log — append any business event to a tamper-evident, post-quantum chain. Each event is content-addressed and recorded as a Falcon-1024-signed entry linked to the previous one, forming an append-only log that anyone can verify offline: no entry can be altered, inserted, removed, reordered, or back-dated. Pluggable store; self-contained."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["audit-log", "tamper-evident", "append-only", "post-quantum", "immutable-log", "event-log", "sox", "provenance"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
    "rfc8785>=0.1.4",
    "substrate2>=2.0.0,<3.0",
    "pqcrypto>=0.4.0,<1.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1.0"]

[project.scripts]
algovoi-audit-log-serve = "algovoi_audit_log.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_audit_log"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_audit_log/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
