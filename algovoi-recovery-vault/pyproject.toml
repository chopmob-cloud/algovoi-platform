[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-recovery-vault"
license = { text = "BUSL-1.1" }
version = "0.1.5"
description = "Sealed, client-deployed key-recovery vault appliance for AlgoVoi Verifiable Archive (threshold, post-quantum)."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "substrate2>=2.0.0,<3.0",
    "algovoi-doc-archive>=0.1.0",
    "shamir-mnemonic>=0.3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "rfc8785>=0.1.4",
    "pqcrypto>=0.4.0,<1.0",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/recovery-vault"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_recovery_vault"]
