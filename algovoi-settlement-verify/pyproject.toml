[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-settlement-verify"
version = "0.1.3"
description = "Multi-chain stablecoin settlement verification across 8 chains (Algorand, VOI, Base/EVM, Solana, Hedera, Stellar, Tempo, Arc). Confirm a payment settled and finalised on-chain, with per-chain finality, asset-id, decimal and trustline handling. RPC injected; no infrastructure dependency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["stablecoin", "settlement", "verification", "multichain", "x402", "payments"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pqcrypto>=0.4.0,<1.0",
    "rfc8785>=0.1.4",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_settlement_verify"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_settlement_verify/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
