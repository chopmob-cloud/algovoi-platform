[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-gateway-suite"
version = "0.1.3"
description = "All-chains meta-package for the AlgoVoi payment gateway: one licence installs gateway-core plus every chain provider (Algorand, Base, Stellar, VOI, Hedera, Solana, Tempo)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
dependencies = [
    "algovoi-gateway-core>=0.1.3",
    "algovoi-gateway-algorand>=0.1.3",
    "algovoi-gateway-base>=0.1.3",
    "algovoi-gateway-stellar>=0.1.3",
    "algovoi-gateway-voi>=0.1.3",
    "algovoi-gateway-hedera>=0.1.3",
    "algovoi-gateway-solana>=0.1.3",
    "algovoi-gateway-tempo>=0.1.3",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/gateway-suite"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_gateway_suite"]
