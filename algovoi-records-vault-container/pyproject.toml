[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-records-vault-container"
version = "0.2.4"
description = "Sealed, portable, post-quantum encrypted records containers (.acv) for AlgoVoi Records Vault, with create and revoke from the Compliance Command Center."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi" }]
dependencies = [
    "algovoi-records-vault>=0.5.0",
    "algovoi-doc-archive>=0.1.1",
    "pqcrypto>=0.4.0,<1.0",
    "rfc8785>=0.1.2",
    "cryptography>=50.0.0",
    "shamir-mnemonic>=0.3.0",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/records-vault-container"

[project.scripts]
acv-unseal = "algovoi_records_vault_container.acv_unseal:main"

[tool.setuptools.packages.find]
where = ["src"]
