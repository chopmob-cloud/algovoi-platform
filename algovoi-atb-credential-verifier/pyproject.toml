[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "algovoi-atb-credential-verifier"
version = "0.1.1"
description = "Standalone verifier for AlgoVoi ATB Pass Certificates (X-ATB-Credential and X-ATB-ZK-Credential). Verifies Falcon-1024 signed Phase 1 certificates and Bulletproofs ZKP Phase 2 certificates. Multi-hub, offline-capable, LRU-cached."
readme = "README.md"
license = { text = "BUSL-1.1" }
authors = [
    { name = "AlgoVoi", email = "hello@algovoi.co.uk" },
]
keywords = [
    "algovoi", "atb", "agent-trust-bench", "x402", "falcon-1024",
    "pqc", "post-quantum", "zkp", "bulletproofs", "credential-verifier",
    "ai-agent", "behavioral-attestation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10"
dependencies = [
    "rfc8785>=0.1.2",
    "httpx>=0.24.0,<1.0",
]

[project.optional-dependencies]
verify = [
    "algovoi-substrate-pqc>=0.1.2",
    "algovoi-bpverify>=0.1.0",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/atb-credential-verifier"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_atb_credential_verifier"]
