[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-gateway-solana"
version = "0.1.4"
description = "Solana chain add-on for the AlgoVoi payment gateway: detect USDC (SPL) settlement via JSON-RPC signature + transaction parsing with finality, emit signed settlement receipts through algovoi-gateway-core."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
dependencies = ["algovoi-gateway-core>=0.1.2", "rfc8785>=0.1.4", "pqcrypto>=0.4.0,<1.0"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/gateway-solana"

[project.optional-dependencies]
custody = ["solana>=0.34"]

[project.entry-points."algovoi_gateway.providers"]
solana = "algovoi_gateway_solana:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_gateway_solana"]
