[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-doc-archive"
version = "0.1.6"
description = "Verifiable Archive — a tamper-evident, post-quantum document archive. Every document is content-addressed, encrypted at rest (ML-KEM-1024 + AES-256-GCM), and recorded as a Falcon-1024-signed entry in an append-only, hash-linked chain that is offline-verifiable. This package ships the engine + a local filesystem backend; swap the storage backend without changing the evidence model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["archive", "worm", "tamper-evident", "notarization", "post-quantum", "records-retention", "compliance", "provenance"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.5,<3.0",
    "rfc8785>=0.1.4",
    "pqcrypto>=0.4.0,<1.0",
    "cryptography>=50.0.0",
    "shamir-mnemonic>=0.3.0",
]

[project.optional-dependencies]
# The HTTP service layer (create_app / bearer_token_auth) is optional — the engine runs as a
# pure library (notarize / verify / recovery / BYO-key custody) without a web framework.
serve = ["fastapi>=0.110,<1.0", "uvicorn>=0.29,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1.0"]

[project.scripts]
algovoi-doc-archive-serve = "algovoi_doc_archive.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_doc_archive"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_doc_archive/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# src/ on sys.path so a fresh clone can run its own suite without exporting PYTHONPATH.
pythonpath = ["src"]
