[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-proofs"
version = "0.1.1"
description = "Proofs — privacy-preserving compliance proofs. Mint a zero-knowledge proof that a payment was screened/compliant and the payer's score is above a threshold, without revealing PII or the score; verify it publicly. Prover URL + signing key injected; self-contained envelope, no infrastructure dependency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["zero-knowledge", "compliance", "proof", "bulletproofs", "post-quantum", "privacy", "payments"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "rfc8785>=0.1.4",
    "pqcrypto>=0.4.0,<1.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_proofs"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_proofs/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
