[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-gateway-tempo"
version = "0.1.4"
description = "Tempo chain add-on for the AlgoVoi payment gateway: detect USDCe (TIP-20) settlement on the Tempo EVM L1 via JSON-RPC Transfer logs with finality, reusing the Base/EVM provider. Emits signed settlement receipts through algovoi-gateway-core."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
dependencies = ["algovoi-gateway-core>=0.1.2", "algovoi-gateway-base>=0.1.3", "rfc8785>=0.1.4", "pqcrypto>=0.4.0,<1.0"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/gateway-tempo"

[project.optional-dependencies]
custody = ["eth-account>=0.10"]

[project.entry-points."algovoi_gateway.providers"]
tempo = "algovoi_gateway_tempo:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_gateway_tempo"]
