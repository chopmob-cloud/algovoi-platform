[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-sanctions-monitor"
version = "0.1.4"
description = "Continuous sanctions monitoring as signed, no-PII delta evidence — watchlist re-screening with Falcon-1024-signed delta receipts on every status change. Commercial OEM engine for Substrate 2."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
license = { text = "BUSL-1.1" }
dependencies = [
    "pydantic>=2.5,<3.0",
    "rfc8785>=0.1.4",
    "substrate2>=2.0.0,<3.0",
    "pqcrypto>=0.4.0,<1.0",
    "cryptography>=50.0.0",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/sanctions-monitor"

[project.optional-dependencies]
service = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0", "httpx>=0.27,<1.0"]
serve = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0", "httpx>=0.27,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fastapi>=0.110,<1.0", "httpx>=0.27,<1.0"]

[project.scripts]
algovoi-sanctions-monitor-serve = "algovoi_sanctions_monitor.serve:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_sanctions_monitor"]
