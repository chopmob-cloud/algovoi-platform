[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-gateway-algorand"
version = "0.1.5"
description = "Algorand chain add-on for the AlgoVoi payment gateway: detect USDC (ASA) settlement via the Algorand indexer with instant finality, emit signed settlement receipts through algovoi-gateway-core. Optional operator-held custody/payout via the [custody] extra."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
dependencies = ["algovoi-gateway-core>=0.1.2", "rfc8785>=0.1.4", "pqcrypto>=0.4.0,<1.0"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/chains/algorand"

[project.optional-dependencies]
custody = ["py-algorand-sdk>=2.0"]

[project.entry-points."algovoi_gateway.providers"]
algorand = "algovoi_gateway_algorand:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_gateway_algorand"]
