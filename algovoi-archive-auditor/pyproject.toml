[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-archive-auditor"
version = "0.1.1"
description = "Reporting & auditing for the AlgoVoi Verifiable Archive. Runs read-only over the same storage backend (local or S3) to produce Falcon-1024-signed audit reports, continuous integrity attestations, retention/compliance reports, records inventory, and portable evidence packs — and exports events/metrics to existing SIEM, observability, and GRC tools (JSON-lines, syslog, CEF, CSV, Prometheus)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["audit", "reporting", "compliance", "retention", "siem", "prometheus", "evidence", "attestation"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pqcrypto>=0.4.0,<1.0",
    "rfc8785>=0.1.4",
    "algovoi-doc-archive>=0.1.0",
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_archive_auditor"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_archive_auditor/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
