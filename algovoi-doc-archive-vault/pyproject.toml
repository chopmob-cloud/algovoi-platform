[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-doc-archive-vault"
version = "0.1.2"
description = "HashiCorp Vault (transit) key custody for the AlgoVoi Verifiable Archive. Hold your Falcon-1024 signing key and ML-KEM encryption key in Vault's transit engine; AlgoVoi only ever holds the ciphertext. Keys are unwrapped via transit only at sign/decrypt time and zeroized after. The signed/encrypted output is unchanged, so verification is unaffected. Ideal for self-hosted / air-gapped estates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["vault", "hashicorp", "transit", "byok", "hyok", "key-custody", "post-quantum", "falcon", "ml-kem"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pqcrypto>=0.4.0,<1.0",
    "rfc8785>=0.1.4",
    "algovoi-doc-archive>=0.1.0",
    "hvac>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "cryptography>=50.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_doc_archive_vault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
