[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-spend-guardrail"
version = "0.2.2"
description = "Spend Guardrail — the decision point for agentic payments. One self-hosted call an agent platform makes before executing a payment: verify the Agent Passport, run the Payment Mandate per-period authorize-charge, apply platform policy, and return a signed ALLOW/DENY decision receipt. Each decision is content-addressed (recomputes the published guardrail_ref byte-for-byte), replay-proof, and chained into a CCC-ingestable evidence pack. The authorization stack (Agent Passport + Payment Mandate) wired into a single enforcement gate. Moves no funds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["agentic-payments", "spend-control", "authorization", "policy", "guardrail", "post-quantum", "ap2"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pqcrypto>=0.4.0,<1.0",
    "rfc8785>=0.1.4",
    "algovoi-agent-passport>=0.1.0",
    "algovoi-payment-mandate>=0.1.0",
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1.0"]
postgres = ["psycopg>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_spend_guardrail"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_spend_guardrail/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
