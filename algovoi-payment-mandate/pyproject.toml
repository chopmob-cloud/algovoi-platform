[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-payment-mandate"
version = "0.3.2"
description = "Payment Mandate — issue, verify, and authorize charges against post-quantum-signed payment mandates. The verifiable, revocable authorization that makes recurring and agentic crypto payments possible: a payer authorizes 'up to X per period until Y', and every pull is checked against the mandate's per-period cap. Signing key injected; pluggable store; self-contained."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["payment-mandate", "recurring-payments", "agentic-payments", "authorization", "post-quantum", "ap2", "subscriptions"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
    "rfc8785>=0.1.4",
    "pqcrypto>=0.4.0,<1.0",
    "algovoi-retention-chain>=0.1.0",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/algovoi_payment_mandate"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "algovoi_payment_mandate/THIRD-PARTY-NOTICES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
